<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The extension trusts https://bitchord.in only (web/extension/site.config.ts),
      // so www goes there before anything loads, keeping its path and query.
      if (location.hostname === 'www.bitchord.in') location.replace('https://bitchord.in' + location.pathname + location.search + location.hash);
    </script>
    <script>
      // Appearance before first paint (lib/theme.ts). Light is the designed
      // default; Dark and System are settings. Without this the window flashes
      // the wrong scheme for a frame.
      (function () {
        var pref = 'light';
        try {
          pref = localStorage.getItem('bitchord:theme') || 'light';
        } catch (e) {}
        var isDark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F2EFE7" />
    <title>BitChord</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Plus Jakarta Sans is the primary typeface for Light Ceramic Edition -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
